version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
    - intent: bot_challenge
    - action: utter_iamabot

- rule: Bot answers when asked for its name
  steps:
    - intent: ask_bot_name
    - action: utter_ask_bot_name


- rule: Handle chord request
  steps:
    - intent: cari_chord
    - action: action_beri_info_kunci