version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - ask_bot_name
  - cari_chord          

entities:
  - nama_kunci          

slots:                  
  nama_kunci:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: nama_kunci

responses:
  utter_greet:
    - text: "Halo apa kamu punya pertanyaan?"
  utter_cheer_up:
    - text: "jadilah lebih baik"
  utter_did_that_help:
    - text: "apa itu membantu?"
  utter_happy:
    - text: "bagus, lanjutkan"
  utter_goodbye:
    - text: "Bye"
  utter_iamabot:
    - text: "Aku adalah AI unutuk belajar gitar"
  utter_ask_bot_name:
    - text: "Nama ku Zaneta, ada apa?"
  utter_ask_chord:      
    - text: "Kunci gitar apa yang ingin kamu ketahui posisinya?"

actions:                
  - action_beri_info_kunci

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true